spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: filmlog-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:filmlog}
    username: ${DB_USER:filmlog}
    password: ${DB_PASSWORD:filmlog}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

tmdb:
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p/w500
  access-token: ${TMDB_TOKEN:}

jwt:
  secret: ${JWT_SECRET:ThisIsADevOnlySecretKeyChangeItInProductionMake64CharsLong123456}
  expiration: 86400000